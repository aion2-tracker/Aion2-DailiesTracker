<!doctype html>
<html lang="es" data-faction="asmodian">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AION 2 Tracker</title>
  <meta name="description" content="Checklist diaria y semanal de AION 2 para tu main y tus alters, con contadores de reset por zona horaria.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 4c-3 6-9 8-13 8 3 3 7 4 10 3-2 3-2 8 3 13 5-5 5-10 3-13 3 1 7 0 10-3-4 0-10-2-13-8z' fill='%23d9ae5c'/></svg>">
  <link rel="preload" href="fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/marcellus-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4c-3 6-9 8-13 8 3 3 7 4 10 3-2 3-2 8 3 13 5-5 5-10 3-13 3 1 7 0 10-3-4 0-10-2-13-8z"/></svg>
      <h1>AION 2 Tracker</h1>
    </div>
    <div class="top-actions">
      <div class="faction" role="group" aria-label="Tema">
        <button type="button" data-set-faction="elyos" data-i18n="elyos">Elyos</button>
        <button type="button" data-set-faction="asmodian" data-i18n="asmodian">Asmodian</button>
      </div>
      <div class="seg langs" role="group" aria-label="Idioma">
        <button type="button" data-lang="es"><svg class="flag" viewBox="0 0 3 2" aria-hidden="true"><path fill="#c60b1e" d="M0 0h3v2H0z"/><path fill="#ffc400" d="M0 .5h3v1H0z"/></svg>ES</button>
        <button type="button" data-lang="en"><svg class="flag" viewBox="0 0 60 40" aria-hidden="true"><clipPath id="fl-uk"><path d="M0 0h60v40H0z"/></clipPath><g clip-path="url(#fl-uk)"><path fill="#012169" d="M0 0h60v40H0z"/><path stroke="#fff" stroke-width="8" d="M0 0l60 40M60 0L0 40"/><path stroke="#c8102e" stroke-width="3" d="M0 0l60 40M60 0L0 40"/><path stroke="#fff" stroke-width="12" d="M30 0v40M0 20h60"/><path stroke="#c8102e" stroke-width="7" d="M30 0v40M0 20h60"/></g></svg>EN</button>
      </div>
      <a class="star" id="starLink" href="https://github.com/aion2-tracker/Aion2-DailiesTracker" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .9l2.2 4.5 4.9.7-3.6 3.5.9 4.9L8 12.2l-4.4 2.3.9-4.9L.9 6.1l4.9-.7z"/></svg><span id="starCount"></span>
      </a>
    </div>
  </header>

  <section class="clocks" id="clocks" aria-label="Resets"></section>

  <nav class="roster" id="roster" aria-label="Personajes"></nav>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="checklist" data-i18n="tab_checklist">Checklist</button>
    <button role="tab" data-tab="overview" data-i18n="tab_overview">Roster</button>
    <button role="tab" data-tab="transfers" data-i18n="tab_transfers">Traspasos</button>
    <button role="tab" data-tab="progress" data-i18n="tab_progress">Progresión</button>
    <button role="tab" data-tab="craft" data-i18n="tab_craft">Crafteo</button>
    <button role="tab" data-tab="tips" data-i18n="tab_tips">Consejos</button>
    <button role="tab" data-tab="settings" data-i18n="tab_settings">Ajustes</button>
  </nav>

  <main id="view"></main>

  <footer class="foot">
    <p data-i18n="footer">Proyecto de fans, sin relación con NCSOFT. Tus datos se guardan solo en este navegador.</p>
  </footer>

  <dialog id="dlg"></dialog>

  <script src="data.js"></script>
  <script src="craft.js"></script>
  <script src="app.js"></script>
</body>
</html>
